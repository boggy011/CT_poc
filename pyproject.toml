[project]
name = "retpack"
version = "0.1.0"
description = "ABI RetPack Portal - returnable packaging intake portal"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "uuid-utils>=0.9",
    "pypdf>=4.2",
    "regex>=2024.5",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.40",
]
databricks = [
    "databricks-sql-connector>=3.4",
    "databricks-sdk>=0.40",
]
lakebase = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "types-regex>=2026.9.3.20260903",
    "pip-audit>=2.10.1",
    "bandit>=1.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/retpack_core",
    "src/retpack_adapters",
    "src/retpack_ui",
    "src/retpack_jobs",
]

[tool.ruff]
line-length = 160
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN", "D"]
ignore = ["D100", "D104", "D107", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["retpack_core", "retpack_adapters", "retpack_ui", "retpack_jobs"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["retpack_ui.*", "retpack_adapters.*", "retpack_jobs.*"]
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: needs a Databricks workspace (env-gated)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.bandit]
# B404/B603: the PDF sandbox deliberately runs a fixed, argument-list subprocess of our own module.
skips = ["B404", "B603"]
