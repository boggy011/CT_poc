# Keep server.maxUploadSize in sync with config/attachments.yaml (max_size_mb); tests/unit/test_streamlit_config.py enforces it.
[server]
maxUploadSize = 25
maxMessageSize = 50
headless = true

[client]
showErrorDetails = "none"

[browser]
gatherUsageStats = false

# Visual identity: slate neutrals with a copper accent; status colours are semantic and live in retpack_ui/theme.py.
[theme]
base = "light"
primaryColor = "#B4661F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F8"
textColor = "#1E2530"
linkColor = "#8A4B12"
font = "Public Sans"
headingFont = "Barlow Semi Condensed"
codeFont = "IBM Plex Mono"
baseRadius = "6px"
buttonRadius = "6px"
borderColor = "#D9DEE5"
dataframeBorderColor = "#D9DEE5"
dataframeHeaderBackgroundColor = "#F3F5F8"
showWidgetBorder = true

[[theme.fontFaces]]
